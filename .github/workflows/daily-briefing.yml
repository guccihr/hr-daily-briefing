name: Daily briefing

on:
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST (GitHub 사정으로 수십 분 늦을 수 있다)
  workflow_dispatch: # Actions 탭에서 수동 실행

permissions:
  contents: write # 생성한 JSON을 커밋

concurrency: daily-briefing

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRIEFING_MODEL: gemma3:12b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the model (Ollama, runs on this runner)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          ollama pull "$BRIEFING_MODEL"
      - name: Generate today's briefing
        run: node generate.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefings
          git diff --cached --quiet || git commit -m "Briefing $(TZ=Asia/Seoul date +%F)"
          git push
